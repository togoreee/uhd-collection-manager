<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>UHD蓝光原盘清单</title>
<style>
*{box-sizing:border-box}
body{background:#141414;color:#eee;font-family:Roboto,sans-serif;margin:20px}
table{border-collapse:collapse;margin-top:15px;table-layout:auto}
th,td{border:1px solid #333;padding:10px;text-align:left;font-size:14px}
th{background:#222;cursor:pointer;user-select:none}
th:hover{background:#333}
.native{background:#193322}
.upscale{background:#2c2219}
.have{background:#004422}
.miss{background:#331919}
input{padding:10px;font-size:14px;background:#222;color:#fff;border:1px solid #444;border-radius:6px}
select{padding:10px;font-size:14px;background:#222;color:#fff;border:1px solid #444;border-radius:6px}
.filter-row{margin:10px 0;font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a{color:#4caf50;text-decoration:none}
a:hover{text-decoration:underline}
#exportBtn{padding:6px 10px;background:#307030;color:white;border:none;border-radius:6px;cursor:pointer;font-size:14px}
.pager{margin:14px 0;display:flex;gap:8px;align-items:center}
.pager button{padding:6px 10px;background:#222;color:#fff;border:1px solid #444;border-radius:4px;cursor:pointer}
.pager button:disabled{opacity:0.3;cursor:not-allowed}
</style>
</head>
<body>
<h1>UHD蓝光原盘清单 <span id="total"></span></h1>
<div class="filter-row">
<input id="search" placeholder="搜索中文/英文片名、TMDBID">
<select id="decadeSelect">
<option value="">全部年代</option>
<option value="1960">1960s</option>
<option value="1970">1970s</option>
<option value="1980">1980s</option>
<option value="1990">1990s</option>
<option value="2000">2000s</option>
<option value="2010">2010s</option>
<option value="2020">2020s</option>
</select>
<select id="scoreSelect">
<option value="">全部分数</option>
<option value="8.0">≥8.0</option>
<option value="7.5">≥7.5</option>
<option value="7.0">≥7.0</option>
<option value="6.5">≥6.5</option>
<option value="6.0">≥6.0</option>
</select>
<select id="hasLocalSelect">
<option value="">全部馆藏</option>
<option value="1" selected>已收藏</option>
<option value="0">待补</option>
</select>
<select id="genreSelect">
<option value="">全部类型</option>
<option value="动作">动作</option>
<option value="剧情">剧情</option>
<option value="惊悚">惊悚</option>
<option value="冒险">冒险</option>
<option value="喜剧">喜剧</option>
<option value="恐怖">恐怖</option>
<option value="科幻">科幻</option>
<option value="犯罪">犯罪</option>
<option value="奇幻">奇幻</option>
<option value="家庭">家庭</option>
<option value="悬疑">悬疑</option>
<option value="动画">动画</option>
<option value="爱情">爱情</option>
<option value="战争">战争</option>
<option value="历史">历史</option>
<option value="音乐">音乐</option>
<option value="西部">西部</option>
<option value="纪录">纪录</option>
</select>
<label><input type="checkbox" id="onlynative">仅Native4K</label>
<button id="exportBtn">导出当前筛选全部CSV</button>
</div>
<div class="pager">
<button id="prevBtn">上一页</button>
<span id="pageInfo"></span>
<button id="nextBtn">下一页</button>
</div>
<table>
<thead>
<tr>
<th data-sort="tmdb_id">TMDB ID</th>
<th data-sort="cn_title">中文片名</th>
<th data-sort="title">英文原名</th>
<th data-sort="has_local">馆藏状态</th>
<th data-sort="year">年份</th>
<th data-sort="tmdb_rating">TMDB评分</th>
<th data-sort="genre">片子类型</th>
<th data-sort="date_added">加入日期</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<script>
const API_BASE = location.origin.replace(":8080",":8081");
let currentPage = 1;
let sortCol = "year";
let sortDir = -1;

function esc(s){return String(s).replace(/"/g,'""')}

async function loadPage(){
    const q = document.getElementById("search").value;
    const decade = document.getElementById("decadeSelect").value;
    const minScore = document.getElementById("scoreSelect").value;
    const onlyNative = document.getElementById("onlynative").checked ? 1 :0;
    const hasLocal = document.getElementById("hasLocalSelect").value;
    const genre = document.getElementById("genreSelect").value;
    
    const url = `${API_BASE}/?page=${currentPage}&q=${encodeURIComponent(q)}&decade=${decade}&min_score=${minScore}&onlynative=${onlyNative}&has_local=${hasLocal}&genre=${genre}&sort=${sortCol}&dir=${sortDir}`;
    
    try{
        const resp = await fetch(url);
        const data = await resp.json();
        
        document.getElementById("total").textContent = `总:${data.total}`;
        document.getElementById("pageInfo").textContent = `${data.current_page}/${data.total_page}`;
        document.getElementById("prevBtn").disabled = data.current_page <= 1;
        document.getElementById("nextBtn").disabled = data.current_page >= data.total_page;
        
        const tbody = document.getElementById("tbody");
        tbody.innerHTML = "";
        
        data.list.forEach(r=>{
            const tr = document.createElement("tr");
            
            if(r.has_local === "1"){
                tr.className = r.native_4k==="1" ? "native have" : "upscale have";
            }else{
                tr.className = r.native_4k==="1" ? "native miss" : "upscale miss";
            }
            
            const statusText = r.has_local === "1" ? "✅已收藏" : "❌待补";
            let statusHtml;
            if(r.has_local === "1" && r.emby_url){
                statusHtml = `<a href="${r.emby_url}" target="_blank" style="color:#4caf50;text-decoration:none">${statusText}</a>`;
            }else{
                statusHtml = statusText;
            }
            
            tr.innerHTML = `
<td><a href="https://www.themoviedb.org/movie/${r.tmdb_id}" target="_blank">${r.tmdb_id}</a></td>
<td><a href="https://www.themoviedb.org/movie/${r.tmdb_id}" target="_blank">${r.cn_title || "-"}</a> <a href="https://search.douban.com/movie/subject_search?search_text=${encodeURIComponent(r.cn_title || r.title)}" target="_blank" style="font-size:12px;color:#888">豆瓣</a></td>
<td><a href="movie.html?tmdb=${r.tmdb_id}" target="_blank">${r.title}</a></td>
<td>${statusHtml}</td>
<td>${r.year}</td>
<td>${r.tmdb_rating||"-"}</td>
<td>${r.genre||"-"}</td>
<td>${r.date_added||"-"}</td>`;
            
            tbody.appendChild(tr);
        });
    }catch(e){
        document.getElementById("total").textContent = "加载失败:"+e;
        console.error(e);
    }
}

document.getElementById("prevBtn").addEventListener("click",()=>{
    if(currentPage>1){currentPage--;loadPage()}
});
document.getElementById("nextBtn").addEventListener("click",()=>{
    currentPage++;loadPage()
});
document.getElementById("search").addEventListener("input",()=>{currentPage=1;loadPage()});
document.getElementById("decadeSelect").addEventListener("change",()=>{currentPage=1;loadPage()});
document.getElementById("scoreSelect").addEventListener("change",()=>{currentPage=1;loadPage()});
document.getElementById("hasLocalSelect").addEventListener("change",()=>{currentPage=1;loadPage()});
document.getElementById("genreSelect").addEventListener("change",()=>{currentPage=1;loadPage()});
document.getElementById("onlynative").addEventListener("change",()=>{currentPage=1;loadPage()});

document.querySelectorAll("th[data-sort]").forEach(th=>{
    th.addEventListener("click",()=>{
        const key = th.dataset.sort;
        if(sortCol === key) sortDir *= -1;
        else {sortCol=key;sortDir=-1}
        currentPage = 1;
        loadPage();
    });
});

loadPage();
</script>
</body>
</html>
